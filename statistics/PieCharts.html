<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Session Usage Pie Charts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="pie-charts-page">
  <div class="controls">
    <label>
      JSON endpoint:
      <input
        id="urlInput"
        type="url"
        value="https://rcgame.azurewebsites.net/api/GetLevelAchievementsD4j2Drb88fDaKfQb75P?from=2026-09-01"
      />
    </label>
    <div class="controls-row">
      <label class="search-box">
        Search all columns:
        <input
          id="searchInput"
          type="search"
          placeholder="e.g. FullFlowSheetMusic or Oboe"
          autocomplete="off"
        />
      </label>
    </div>
    <div>
      <button id="fetchBtn" type="button">Fetch &amp; Render</button>
      <button id="clearBtn" type="button">Clear</button>
    </div>
    <div id="status" class="status" role="status"></div>
  </div>

  <main>
    <section id="charts" class="charts" aria-label="Session usage pie charts"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="shared-enums.js"></script>
  <script src="pie-charts.js"></script>
</body>
</html>
